<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetLinksAI - 智能体编排与应用发布平台</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <div style="width: 48px; height: 48px; background: rgba(255, 255, 255, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 12px;">
                        <i class="fas fa-robot" style="font-size: 24px; color: white;"></i>
                    </div>
                    <h1>JetLinksAI</h1>
                </div>
                <p class="subtitle">智能体编排与应用发布平台</p>
            </div>
            
            <div class="login-form">
                <div class="form-tabs">
                    <button class="tab-button active" data-tab="login">登录</button>
                    <button class="tab-button" data-tab="register">注册</button>
                </div>
                
                <!-- 登录表单 -->
                <form id="loginForm" class="tab-content active">
                    <div class="form-group">
                        <label for="username">用户名/邮箱</label>
                        <input type="text" id="username" name="username" required 
                               placeholder="请输入用户名或邮箱">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="请输入密码">
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="rememberMe">
                            <span>记住登录状态</span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>
                    
                    <button type="submit" class="login-button">登录</button>
                </form>
                
                <!-- 注册表单 -->
                <form id="registerForm" class="tab-content">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" name="username" required 
                               placeholder="请输入用户名">
                    </div>
                    
                    <div class="form-group">
                        <label for="regEmail">邮箱</label>
                        <input type="email" id="regEmail" name="email" required 
                               placeholder="请输入邮箱地址">
                    </div>
                    
                    <div class="form-group">
                        <label for="regFullName">姓名</label>
                        <input type="text" id="regFullName" name="fullName" required 
                               placeholder="请输入真实姓名">
                    </div>
                    
                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" name="password" required 
                               placeholder="请输入密码（至少6位）">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               placeholder="请再次输入密码">
                    </div>
                    
                    <button type="submit" class="login-button">注册</button>
                </form>
            </div>
            
            <div class="login-footer">
                <p>© 2024 JetLinksAI. All rights reserved.</p>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>正在处理中...</p>
    </div>
    
    <!-- Toast Messages Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <script src="/static/js/common.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
